limit_req_zone $binary_remote_addr zone=piscine_login:10m rate=5r/m;

server {
    listen 80;
    server_name piscine.example.com;          # <- à adapter ; certbot ajoutera le bloc HTTPS
    client_max_body_size 64k;

    location /static/ { alias /opt/piscine/static/; expires 7d; }

    # Anti brute-force : 5 tentatives/minute/IP sur la connexion
    location = /login {
        limit_req zone=piscine_login burst=5 nodelay;
        proxy_pass http://unix:/run/piscine/piscine.sock;
        include proxy_params;
    }
    location / {
        proxy_pass http://unix:/run/piscine/piscine.sock;
        include proxy_params;
    }
}
